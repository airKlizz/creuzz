apiVersion: creuzz.io/v1alpha1
kind: ClusterAgentSkill
metadata:
  name: rest-api-design
spec:
  fileName: "rest-api.md"
  content: |
    # REST API Design Standards

    ## Resource Naming
    - Use plural nouns: `/users`, `/orders`
    - Use kebab-case for multi-word: `/order-items`
    - Nest resources logically: `/users/{id}/orders`
    - Avoid verbs in URLs

    ## HTTP Methods
    | Method | Purpose | Idempotent | Safe |
    |--------|---------|------------|------|
    | GET | Read | Yes | Yes |
    | POST | Create | No | No |
    | PUT | Replace | Yes | No |
    | PATCH | Update | No | No |
    | DELETE | Delete | Yes | No |

    ## Status Codes
    - `200 OK` — Successful GET, PUT, PATCH
    - `201 Created` — Successful POST
    - `204 No Content` — Successful DELETE
    - `400 Bad Request` — Invalid input
    - `401 Unauthorized` — Authentication required
    - `403 Forbidden` — Insufficient permissions
    - `404 Not Found` — Resource doesn't exist
    - `409 Conflict` — Resource conflict
    - `500 Internal Server Error` — Server error

    ## Versioning
    - URL versioning: `/v1/users`, `/v2/users`
    - Deprecate with `Sunset` header
    - Support at least one previous version

    ## Pagination
    - Cursor-based for large datasets
    - Include `next` and `prev` links
    - Default page size: 20, max: 100
