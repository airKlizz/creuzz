apiVersion: creuzz.io/v1alpha1
kind: ClusterAgentSkill
metadata:
  name: testing-standards
spec:
  fileName: "testing.md"
  content: |
    # Testing Standards

    ## Unit Tests
    - Test one thing per test case
    - Use table-driven tests (Go)
    - Mock external dependencies
    - Aim for >80% code coverage
    - Fast execution (< 1s for unit tests)

    ## Integration Tests
    - Use testcontainers for dependencies
    - Clean up resources after tests
    - Use unique names to avoid conflicts
    - Test happy path and error cases

    ## Test Structure (AAA Pattern)
    ```go
    func TestUserService_Create(t *testing.T) {
        // Arrange
        svc := NewUserService(mockRepo)
        user := &User{Name: "John"}

        // Act
        err := svc.Create(context.Background(), user)

        // Assert
        assert.NoError(t, err)
        assert.NotEmpty(t, user.ID)
    }
    ```

    ## Test Naming
    - `Test<Function>_<Scenario>_<ExpectedResult>`
    - Example: `TestCreateUser_DuplicateEmail_ReturnsError`
