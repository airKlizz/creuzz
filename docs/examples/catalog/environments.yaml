# Catalog: Environment Profiles
#
# Reusable environment variable profiles.
# Apply with: kubectl apply -f environments.yaml
#
# Note: Referenced secrets must exist in the target namespace.

---
apiVersion: creuzz.io/v1alpha1
kind: ClusterAgentEnv
metadata:
  name: aws-dev-profile
spec:
  variables:
    - name: AWS_DEFAULT_REGION
      value: "eu-west-3"
    - name: AWS_PROFILE
      value: "dev"
    - name: LOG_LEVEL
      value: "debug"
  secrets:
    - name: AWS_ACCESS_KEY_ID
      secretRef: "aws-dev-creds"
      key: "access_key"
    - name: AWS_SECRET_ACCESS_KEY
      secretRef: "aws-dev-creds"
      key: "secret_key"
---
apiVersion: creuzz.io/v1alpha1
kind: ClusterAgentEnv
metadata:
  name: aws-prod-profile
spec:
  variables:
    - name: AWS_DEFAULT_REGION
      value: "eu-west-3"
    - name: AWS_PROFILE
      value: "prod"
    - name: LOG_LEVEL
      value: "info"
  secrets:
    - name: AWS_ACCESS_KEY_ID
      secretRef: "aws-prod-creds"
      key: "access_key"
    - name: AWS_SECRET_ACCESS_KEY
      secretRef: "aws-prod-creds"
      key: "secret_key"
---
apiVersion: creuzz.io/v1alpha1
kind: ClusterAgentEnv
metadata:
  name: llm-config
spec:
  variables:
    - name: OPENCODE_MODEL
      value: "claude-sonnet-4"
    - name: OPENCODE_MAX_TOKENS
      value: "8192"
    - name: OPENCODE_TEMPERATURE
      value: "0.7"
  secrets:
    - name: ANTHROPIC_API_KEY
      secretRef: "llm-api-keys"
      key: "anthropic"
    - name: OPENAI_API_KEY
      secretRef: "llm-api-keys"
      key: "openai"
---
apiVersion: creuzz.io/v1alpha1
kind: ClusterAgentEnv
metadata:
  name: database-config
spec:
  variables:
    - name: DB_POOL_SIZE
      value: "10"
    - name: DB_TIMEOUT
      value: "30s"
    - name: DB_SSLMODE
      value: "require"
  secrets:
    - name: DATABASE_URL
      secretRef: "database-creds"
      key: "url"
    - name: DB_PASSWORD
      secretRef: "database-creds"
      key: "password"
---
apiVersion: creuzz.io/v1alpha1
kind: ClusterAgentEnv
metadata:
  name: cicd-config
spec:
  variables:
    - name: CI
      value: "true"
    - name: GIT_AUTHOR_NAME
      value: "OpenCode Agent"
    - name: GIT_AUTHOR_EMAIL
      value: "agent@company.com"
    - name: GIT_COMMITTER_NAME
      value: "OpenCode Agent"
    - name: GIT_COMMITTER_EMAIL
      value: "agent@company.com"
  secrets:
    - name: GITHUB_TOKEN
      secretRef: "github-creds"
      key: "token"
    - name: GITLAB_TOKEN
      secretRef: "gitlab-creds"
      key: "token"
